<script>
let backgroundGeneration = 0;
function finishBackgroundFade() {
  document.querySelectorAll('.pane-background-previous').forEach(image => {
    image.getAnimations().forEach(animation => animation.cancel());
    image.remove();
  });
  const current = document.getElementById('pane-background');
  if (current) {
    current.getAnimations().forEach(animation => animation.cancel());
    current.style.opacity = '1';
  }
}
function setPaneBackground(url) {
  const pane = document.querySelector('.panel');
  const current = document.getElementById('pane-background');
  if (current?.dataset.source === url) return;
  const generation = ++backgroundGeneration;
  finishBackgroundFade();
  if (!url) {
    if (current) {
      current.removeAttribute('src');
      current.hidden = true;
      current.dataset.source = '';
    }
    return;
  }
  // Decode the next file before touching the displayed image; retain at most two layers.
  const incoming = document.createElement('img');
  incoming.alt = '';
  incoming.setAttribute('aria-hidden', 'true');
  incoming.dataset.source = url;
  incoming.className = 'pane-background-layer';
  incoming.style.opacity = '0';
  incoming.onload = () => {
    if (generation !== backgroundGeneration) { incoming.remove(); return; }
    const previous = current && !current.hidden && current.hasAttribute('src') ? current : null;
    if (current) {
      current.removeAttribute('id');
      current.classList.add('pane-background-previous');
    }
    incoming.id = 'pane-background';
    if (current) current.after(incoming); else pane.prepend(incoming);
    const duration = Math.min(motion.background_fade_ms || 600, (motion.background_seconds || 300) * 1000);
    if (previous && motion.background_crossfade) {
      const options = {duration, fill: 'forwards', easing: 'ease-in-out'};
      previous.animate([{opacity: 1}, {opacity: 0}], options);
      const fade = incoming.animate([{opacity: 0}, {opacity: 1}], options);
      fade.finished.then(() => {
        if (generation === backgroundGeneration) finishBackgroundFade();
      }).catch(() => {});
    } else {
      incoming.style.opacity = '1';
      if (current) current.remove();
    }
  };
  incoming.onerror = () => incoming.remove();
  incoming.src = url;
}
/* CONTRAST_JS */
function applyPanelColor(color) {
  const rgb=panelColorRGB(color).split(',').map(Number);
  const brightness=values=>(values[0]*.2126+values[1]*.7152+values[2]*.0722)/255;
  const mix=(values,target,amount)=>values.map(value=>Math.round(value*(1-amount)+target*amount));
  const base=mix(rgb,brightness(rgb)>.5?0:255,.24);
  const light=brightness(base)>.48;
  const root=document.documentElement.style;
  applyTextContrast(color);
  root.setProperty('--panel-color-rgb',rgb.join(','));
  root.setProperty('--settings-button-bg','rgb('+base.join(',')+')');
  root.setProperty('--settings-button-hover','rgb('+mix(base,light?0:255,.13).join(',')+')');
  root.setProperty('--settings-button-text',light?'#101719':'#f3f5f7');
  root.setProperty('--settings-button-border','rgb('+mix(base,light?0:255,.27).join(',')+')');
}
function panelColorRGB(color) {const hex=/^#[0-9a-f]{6}$/i.test(color||'')?color:'#000000';return [1,3,5].map(index=>parseInt(hex.slice(index,index+2),16)).join(',');}
function connectColorPicker(input,scope){
  input.addEventListener('click',event=>{event.preventDefault();if(app){beginColorPreview();app.choose_color(scope);}});
}
function applyColorPreview(scope,color){
  if(scope==='dictionary'){
    motion.panel_color=color;applyPanelColor(color);
    const input=document.querySelector('[data-setting=panel_color] input');if(input)input.value=color;
  } else if(scope==='avatar'){
    motion.avatar_background_color=color;
    const input=document.querySelector('[data-setting=avatar_background_color] input');if(input)input.value=color||'#000000';
  } else {
    scannerConfig.background_color=color;
    const input=document.getElementById('popup-background_color');if(input)input.value=color;
  }
}
function applyPreferences(values) {
  Object.assign(motion, values);
  applyBackgroundAppearance();
  applyLookupLayout();applyEntryFonts(values);
  for(const key of ['blur_px','avatar_fill_pane','avatar_auto_mirror_sides','avatar_auto_mirror_vertical','background_auto_mirror_sides','background_auto_mirror_vertical']){
    const input=document.querySelector('[data-setting="'+key+'"] input');if(input)input.checked=!!motion[key];
  }
  updatePaneFadeToggle();
  if(!motion.auto_fade)showPanel();
  if(!motion.background_crossfade)finishBackgroundFade();
  document.querySelectorAll('[data-background-fade]').forEach(input=>input.disabled=!motion.background_crossfade);
  document.querySelectorAll('[data-folder-control]').forEach(control => { control.disabled = !(control.dataset.folderControl === 'background' ? values.background_folder : values.avatar_folder); });
  const removeAvatar=document.getElementById('remove-avatar-folder');if(removeAvatar)removeAvatar.hidden=!values.avatar_folder;
  for(const [id,key] of [['edit-avatar-image','avatar'],['edit-background-image','background_image']]){
    const button=document.getElementById(id);if(button)button.disabled=!motion[key];
  }
  applyPanelColor(motion.panel_color);
  const folderStatus=document.getElementById('avatar-folder-status');
  if(folderStatus) { folderStatus.textContent=values.avatar_folder || ''; folderStatus.hidden=!values.avatar_folder; }
  for (const [name, value] of Object.entries({
    'panel-darkness': motion.panel_darkness / 100,
    'blur-radius': motion.blur_px + 'px',
    'fade-in-duration': motion.fade_in_ms + 'ms',
    'fade-out-duration': motion.fade_out_ms + 'ms'
  })) document.documentElement.style.setProperty('--' + name, value);
  document.querySelectorAll('[data-avatar-fade]').forEach(control=>control.disabled=!values.avatar_crossfade);
  updateAvatarPosition(motion.avatar_vertical_position === 'top');
}
function applyBackgroundAppearance(){
  updateBackgroundVisibility();
  document.documentElement.style.setProperty('--background-scale-x',motion.background_mirror_x?-1:1);
  document.documentElement.style.setProperty('--background-scale-y',motion.background_mirror_y?-1:1);
  document.documentElement.style.setProperty('--dictionary-image-blur',(motion.dictionary_image_blur||0)+'px');
  document.documentElement.style.setProperty('--dictionary-image-opacity',(motion.dictionary_image_opacity??100)/100);
  const radius=(motion.dictionary_corner_radius??23)+'px',mode=motion.dictionary_corner_mode||'all';
  panel.style.borderRadius=(mode==='bottom'?'0px 0px '+radius+' '+radius:mode==='top'?radius+' '+radius+' 0px 0px':radius);
}
let settingsExpanded = false;
function paneOrderChanged(values) {
  Object.assign(motion, values);
  updatePaneOrientation(values.split_orientation === 'vertical');
  document.getElementById('swap').title = motion.split_orientation === 'vertical' ? 'Move avatar image left or right' : 'Flip panes left or right';
  if (document.getElementById('inline-settings')) {
    const scroll = document.getElementById('inline-settings').scrollTop;
    document.getElementById('inline-settings').remove();
    showSettings(values);
    document.getElementById('inline-settings').scrollTop = scroll;
  }
}
const paneTransitions = new WeakMap();
function animatePaneContent(node=document.getElementById('inline-settings')||document.getElementById('results')) {
  if(!node||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  paneTransitions.get(node)?.cancel();
  paneTransitions.set(node,node.animate([{opacity:.55,transform:'translateY(3px)'},{opacity:1,transform:'translateY(0)'}],{duration:90,easing:'ease-out'}));
}
function closeSettings() {
  const hadSettings=!!document.getElementById('inline-settings');
  if(typeof cancelScanHotkeyCapture === 'function')cancelScanHotkeyCapture();
  document.getElementById('inline-settings')?.remove();
  panel.classList.remove('settings-open');
  if(hadSettings)animatePaneContent(document.getElementById('results'));
  resumeFade();
}
function updateBackgroundVisibility(){
  const area=document.getElementById('inline-settings');
  const pane=!area?'dictionary':area.querySelector('#reading-stats')?'stats':area.dataset.page==='translation'?'translation':area.dataset.page==='popup'?'popup':['dictionaries','collapse-defaults'].includes(area.dataset.page)?'dictionary':'settings';
  panel.classList.toggle('background-image-disabled',motion['background_show_'+pane]===false);
  panel.dataset.backgroundPane=pane;
}
function showSettings(values) {
  clearTimeout(timer);
  if (document.getElementById('inline-settings')) return;
  showPanel();
  const area = document.createElement('div');
  area.id = 'inline-settings';
  area.setAttribute('aria-label', 'Dictionary settings');
  area.className = 'settings-page';
  panel.classList.add('settings-open');
  const close = dictionaryBackButton();
  area.append(close);
  const heading = document.createElement('h2'); heading.textContent = 'Settings'; area.append(heading);
  const fields = [
    ['pane_order','Pane order','button'],
    ['avatar_vertical_position','Avatar position','select'],
    ['avatar_fill_pane','Fill avatar pane (keep proportions)','checkbox'],
    ['avatar_auto_mirror_sides','Auto-mirror avatar when swapping sides (⇄)','checkbox'],
    ['avatar_auto_mirror_vertical','Auto-mirror avatar when moving top/bottom (⇅)','checkbox'],
    ['background_auto_mirror_sides','Auto-mirror background when swapping sides (⇄)','checkbox'],
    ['background_auto_mirror_vertical','Auto-mirror background when moving top/bottom (⇅)','checkbox'],
    ['blur_px','Dictionary pane blur','checkbox'],
    ['avatar_blur','Avatar pane blur','checkbox'],
    ['dictionary_image_blur','Dictionary background image blur','range',0,40],
    ['dictionary_image_opacity','Dictionary background image opacity','range',0,100],
    ['avatar_image_blur','Avatar image blur','range',0,40],
    ['text_color_mode','Text color','select'],
    ['panel_color','Dictionary background color','color'],
    ['avatar_background_color','Avatar background color','color'],
    ['panel_darkness','Dictionary background color opacity','range',0,100],
    ['avatar_background_opacity','Avatar background opacity','range',0,100],
    ['auto_fade','Fade dictionary when idle','checkbox'],
    ['fade_avatar','Fade avatar with dictionary','checkbox'],
    ['fade_delay_ms','Idle before fade (ms)','number',100,30000],
    ['fade_in_ms','Fade in duration (ms)','number',0,10000],
    ['fade_out_ms','Fade out duration (ms)','number',0,10000]
  ];
  const fontHeading=document.createElement('h3');fontHeading.textContent='Entry text size';area.append(fontHeading);
  const fontRow=document.createElement('label');fontRow.className='settings-row settings-font-family';fontRow.dataset.setting='font_family';
  const fontLabel=document.createElement('span');fontLabel.textContent='Font';
  const fontSelect=document.createElement('select');fontSelect.setAttribute('aria-label','Entry font');
  const defaultFont=document.createElement('option');defaultFont.value='';defaultFont.textContent='Default';fontSelect.append(defaultFont);
  for(const group of motion.font_choices||[]){
    const optgroup=document.createElement('optgroup');optgroup.label=group.label;
    for(const family of group.families){const option=document.createElement('option');option.value=family;option.textContent=family;optgroup.append(option);}
    fontSelect.append(optgroup);
  }
  if(values.font_family&&![...fontSelect.options].some(option=>option.value===values.font_family)){
    const missing=document.createElement('option');missing.value=values.font_family;missing.textContent=values.font_family+' (unavailable)';missing.disabled=true;fontSelect.append(missing);
  }
  fontSelect.value=values.font_family||'';
  fontSelect.onchange=()=>{motion.font_family=fontSelect.value;applyEntryFonts(motion);app.preference('font_family',JSON.stringify(fontSelect.value));};
  fontRow.append(fontLabel,fontSelect);area.append(fontRow);
  for(const [key,title] of [['font_headword','Headword'],['font_reading','Reading'],['font_definition','Definition'],['font_example','Example sentence'],['font_frequency','Frequency'],['font_pitch','Pitch accent']]){
    const row=document.createElement('label');row.className='settings-row';row.dataset.setting=key;
    const text=document.createElement('span');text.textContent=title+' (px)';
    const input=document.createElement('input');input.type='number';input.min=8;input.max=72;input.value=values[key];
    input.oninput=()=>{if(input.value&&input.checkValidity())app.preference(key,JSON.stringify(Number(input.value)));};row.append(text,input);area.append(row);
  }
  const image = document.createElement('button'); image.textContent = 'Choose avatar image…';
  image.onclick = () => app.choose_image();
  const sourceButtons=document.createElement('div'); sourceButtons.className='settings-source-buttons';
  const folder=document.createElement('button'); folder.textContent='Choose folder…'; folder.onclick=()=>app.choose_folder();
  const removeAvatar=document.createElement('button');removeAvatar.id='remove-avatar-folder';removeAvatar.textContent='Remove avatar folder';removeAvatar.hidden=!values.avatar_folder;removeAvatar.onclick=()=>app.preference('avatar_folder',JSON.stringify(''));
  const avatarToggle=document.createElement('button');avatarToggle.id='avatar-toggle';avatarToggle.textContent='Dict. Only';avatarToggle.setAttribute('aria-pressed',String(values.avatar_enabled===false));
  avatarToggle.onclick=()=>{motion.avatar_enabled=motion.avatar_enabled===false;values.avatar_enabled=motion.avatar_enabled;avatarToggle.classList.toggle('active',!motion.avatar_enabled);app.preference('avatar_enabled',JSON.stringify(motion.avatar_enabled));};
  const imageToggle=document.createElement('button');imageToggle.id='avatar-image-toggle';imageToggle.textContent=values.avatar_hidden?'Show avatar':'Hide avatar';imageToggle.setAttribute('aria-pressed',String(!values.avatar_hidden));
  imageToggle.onclick=()=>{motion.avatar_hidden=!motion.avatar_hidden;values.avatar_hidden=motion.avatar_hidden;imageToggle.textContent=motion.avatar_hidden?'Show avatar':'Hide avatar';app.preference('avatar_hidden',JSON.stringify(motion.avatar_hidden));};
  avatarToggle.classList.toggle('active',values.avatar_enabled===false);
  sourceButtons.append(image,folder,removeAvatar,avatarToggle,imageToggle); area.append(sourceButtons);
  const editAvatar=document.createElement('button');editAvatar.type='button';editAvatar.id='edit-avatar-image';editAvatar.textContent='Crop / resize…';editAvatar.disabled=!values.avatar;editAvatar.onclick=()=>app.edit_current_image('avatar');sourceButtons.append(editAvatar);
  function cornerControls(parent,kind){
    const controls=document.createElement('div');controls.className='pane-corner-controls';
    const caption=document.createElement('label');caption.textContent='Radius';
    const input=document.createElement('input');input.type='number';input.min=0;input.max=120;input.value=values[kind+'_corner_radius']??23;input.setAttribute('aria-label',kind+' corner radius');
    input.oninput=()=>{if(input.value!==''&&input.checkValidity())app.preference(kind+'_corner_radius',JSON.stringify(Number(input.value)));};caption.append(input);controls.append(caption);
    const checks=[];
    for(const [mode,title] of [['top','Top only'],['bottom','Bottom only']]){
      const label=document.createElement('label'),check=document.createElement('input');check.type='checkbox';check.checked=values[kind+'_corner_mode']===mode;check.setAttribute('aria-label',kind+' round '+title.toLowerCase());
      check.onchange=()=>{const next=check.checked?mode:'all';for(const [otherMode,other] of checks)other.checked=otherMode===next;values[kind+'_corner_mode']=next;app.preference(kind+'_corner_mode',JSON.stringify(next));};
      checks.push([mode,check]);label.append(check,document.createTextNode(title));controls.append(label);
    }
    parent.append(controls);
  }
  cornerControls(sourceButtons,'avatar');
  const status=document.createElement('p'); status.id='avatar-folder-status'; status.className='settings-intro';
  status.textContent=values.avatar_folder || ''; status.hidden=!values.avatar_folder; area.append(status);
  const stacked = values.split_orientation === 'vertical';
  if (stacked) {
    const position = fields.find(field => field[0] === 'avatar_vertical_position');
    position[0] = 'avatar_horizontal_position';
    values.avatar_horizontal_position = values.avatar_right ? 'right' : 'left';
  }
  fields.unshift(['avatar_seconds','Avatar interval (sec)','number',1,86400], ['background_seconds','Background interval (sec)','number',1,86400], ['avatar_order','Avatar folder order','select'], ['background_order','Background folder order','select'], ['avatar_crossfade','Avatar crossfade','checkbox'], ['avatar_fade_ms','Avatar fade (ms)','number',50,10000], ['background_crossfade','Background crossfade','checkbox'], ['background_fade_ms','Background fade (ms)','number',50,10000]);
  for (const [key,title,type,min,max] of fields) {
    const sectionTitles = {pane_order:'Avatar & layout', blur_px:'Background & appearance', auto_fade:'Motion & visibility'};
    if(sectionTitles[key]) { const section=document.createElement('h3'); section.textContent=sectionTitles[key]; area.append(section); }
    const subheading={blur_px:'Pane blur',dictionary_image_blur:'Image blur',text_color_mode:'Text',panel_color:'Colors',panel_darkness:'Opacity'}[key];
    if(subheading){const heading=document.createElement('h4');heading.className='settings-subheading';heading.textContent=subheading;area.append(heading);}
    const label = document.createElement('label');
    label.className = 'settings-row settings-' + type;
    label.dataset.setting = key;
    const caption = document.createElement('span'); caption.className='settings-caption'; caption.textContent = title; label.append(caption);
    if (type === 'button') {
      const button=document.createElement('button');
      const position=values.split_orientation === 'vertical' ? (values.avatar_top ? 'Top' : 'Bottom') : (values.avatar_right ? 'Right' : 'Left');
      button.textContent=position + ' →'; button.title='Cycle Right → Bottom → Left → Top';
      button.onclick=()=>app.rotate_panes(updatePaneOrientation); label.append(button); area.append(label); continue;
    }
    const input = document.createElement(type === 'select' ? 'select' : 'input');
    if(type === 'select') for (const value of (key==='text_color_mode' ? ['automatic','black','white'] : ['avatar_order','background_order'].includes(key) ? ['default','reverse','random'] : key === 'avatar_horizontal_position' ? ['left','right'] : ['bottom','top'])) {
      const option = document.createElement('option'); option.value=value; option.textContent=value.charAt(0).toUpperCase()+value.slice(1); input.append(option);
    } else input.type=type;
    if(min !== undefined) { input.min=min; input.max=max; }
    input.value=type==='color'?(values[key]||'#000000'):values[key]; input.checked=Boolean(values[key]);
    if(type==='color')connectColorPicker(input,key==='avatar_background_color'?'avatar':'dictionary');
    if(key === 'avatar_seconds' || key === 'avatar_order') { input.dataset.folderControl='avatar'; input.disabled=!values.avatar_folder; }
    if(key === 'background_seconds' || key === 'background_order') { input.dataset.folderControl='background'; input.disabled=!values.background_folder; }

  context.font=font.font;

  const ascent=metrics.fontBoundingBoxAscent??parseFloat(font.fontSize)*.8;
  const descent=metrics.fontBoundingBoxDescent??parseFloat(font.fontSize)*.2;
  const inkTop=bounds.top+(bounds.height-ascent-descent)/2+ascent-metrics.actualBoundingBoxAscent;
  return Math.max(1,inkTop-panel.getBoundingClientRect().top-navbarHeight+2);

}

function scheduleLookup(event) {

  // Broad wildcard scans are explicit searches; Enter still runs immediately.
  let wildcard = false;
  for (let i=0; i<query.value.length; i++) {
    if (query.value[i] === '\\') { i++; continue; }
    if ('*?'.includes(query.value[i])) { wildcard=true; break; }

  timer = setTimeout(() => { if (app) app.search(query.value); }, 180);
}
